<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Mo’s Games</title>
<meta name="theme-color" content="#C8102E">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C8102E;
    --red-deep: #7E0A1C;
    --gold: #FFC21A;
    --gold-deep: #C98A00;
    --asphalt: #1D1E22;
    --white: #FFFFFF;
    --page-bg: var(--red);
    --ink: var(--white);
    --plate-ink: var(--asphalt);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page-bg: #9E0C24; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --page-bg: #9E0C24; color-scheme: dark; }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--page-bg);
    background-image:
      linear-gradient(115deg, transparent 0 62%, rgba(0,0,0,.12) 62% 66%, transparent 66% 70%, rgba(0,0,0,.08) 70% 72%, transparent 72%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Header ---------- */
  header {
    position: relative;
    padding: clamp(28px, 6vw, 56px) 20px clamp(20px, 4vw, 36px);
    text-align: center;
    overflow: hidden;
  }
  .trophy {
    width: clamp(120px, 28vw, 180px);
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 8px 0 var(--red-deep));
  }
  .bolt-flash { transform-origin: center; animation: zap 900ms cubic-bezier(.2,1.4,.4,1) 200ms both; }
  @keyframes zap {
    0% { transform: translate(-60px, -40px) scale(.4) rotate(-20deg); opacity: 0; }
    60% { opacity: 1; }
    100% { transform: none; opacity: 1; }
  }
  h1 {
    margin: 14px 0 0;
    font-family: "Racing Sans One", "Impact", "Arial Black", sans-serif;
    font-weight: 400;
    font-size: clamp(44px, 12vw, 96px);
    line-height: .95;
    letter-spacing: .01em;
    color: var(--white);
    transform: skewX(-8deg);
    text-shadow:
      4px 4px 0 var(--gold-deep),
      8px 8px 0 var(--red-deep);
  }
  .tagline {
    margin: 14px auto 0;
    max-width: 30ch;
    font-size: clamp(18px, 4.4vw, 24px);
    font-weight: 600;
    line-height: 1.3;
  }

  /* ---------- Tiles ---------- */
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 8px 18px 56px;
  }
  .grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
    gap: clamp(18px, 3.5vw, 30px);
  }
  .flag {
    position: relative;
    display: block;
    padding-left: 16px; /* room for the pole */
    color: var(--plate-ink);
    text-decoration: none;
    border-radius: 6px;
    outline-offset: 6px;
  }
  /* the pole */
  .flag::before {
    content: "";
    position: absolute;
    left: 0; top: -10px; bottom: -22px;
    width: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, #8b8f99, #e8eaee 45%, #8b8f99);
  }
  .flag::after {
    content: "";
    position: absolute;
    left: -4px; top: -20px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff2b3, var(--gold) 45%, var(--gold-deep));
  }
  .cloth {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 4px 14px 14px 4px;
    background: repeating-conic-gradient(var(--asphalt) 0 25%, var(--white) 0 50%) 0 0 / 34px 34px;
    box-shadow: 0 8px 0 var(--red-deep);
    display: grid;
    place-items: center;
    transform-origin: left center;
    transition: transform 160ms ease;
    /* gentle wave on the trailing edge */
    -webkit-mask: radial-gradient(18px 34px at right, transparent 98%, #000) right / 100% 68px repeat-y,
                  linear-gradient(#000, #000) left / calc(100% - 18px) 100% no-repeat;
            mask: radial-gradient(18px 34px at right, transparent 98%, #000) right / 100% 68px repeat-y,
                  linear-gradient(#000, #000) left / calc(100% - 18px) 100% no-repeat;
  }
  .plate {
    width: 74%;
    padding: 12px 10px 10px;
    background: var(--white);
    border: 5px solid var(--red);
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 0 rgba(0,0,0,.25);
  }
  .icon { font-size: clamp(44px, 10vw, 60px); line-height: 1; display: block; }
  .name {
    display: block;
    margin-top: 6px;
    font-weight: 800;
    font-size: clamp(19px, 4.6vw, 23px);
    line-height: 1.1;
  }
  a.flag:hover .cloth, a.flag:focus-visible .cloth { transform: rotate(-2deg) scale(1.03); }
  a.flag:active .cloth { transform: scale(.96); }
  a.flag:focus-visible { outline: 4px solid var(--gold); }

  .flag.soon { cursor: default; }
  .flag.soon .cloth { filter: saturate(.6) brightness(.92); }
  .flag.soon .plate { border-style: dashed; }

  /* ---------- Link to little sister's site ---------- */
  .sibling {
    text-align: center;
    padding: 0 20px 28px;
  }
  .sibling a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 56px;
    padding: 8px 22px;
    border-radius: 999px;
    background: #FFB8CF;
    color: #3D1A4B;
    font-weight: 800;
    font-size: clamp(18px, 4.4vw, 22px);
    text-decoration: none;
    box-shadow: 0 5px 0 #5B2A6E;
  }
  .sibling a span[aria-hidden] { font-size: 1.4em; line-height: 1; }
  .sibling a:hover { transform: translateY(-2px); }
  .sibling a:active { transform: translateY(3px); box-shadow: 0 2px 0 #5B2A6E; }
  .sibling a:focus-visible { outline: 4px solid var(--gold); outline-offset: 4px; }

  footer {
    text-align: center;
    padding: 0 20px 32px;
    font-size: 16px;
    opacity: .85;
  }

  @media (prefers-reduced-motion: reduce) {
    .bolt-flash { animation: none; }
    .cloth { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <svg class="trophy" viewBox="0 0 200 210" role="img" aria-label="A gold trophy with a lightning bolt">
      <defs>
        <linearGradient id="gold" x1="0" x2="1">
          <stop offset="0" stop-color="#C98A00"/>
          <stop offset=".35" stop-color="#FFE27A"/>
          <stop offset=".6" stop-color="#FFC21A"/>
          <stop offset="1" stop-color="#C98A00"/>
        </linearGradient>
      </defs>
      <!-- handles -->
      <path d="M48 40 C10 40 12 100 58 104" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
      <path d="M152 40 C190 40 188 100 142 104" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
      <!-- cup -->
      <path d="M40 22 H160 V60 C160 104 132 128 100 128 C68 128 40 104 40 60 Z" fill="url(#gold)"/>
      <rect x="34" y="16" width="132" height="14" rx="7" fill="#FFE27A"/>
      <!-- stem and base -->
      <path d="M88 126 H112 L118 156 H82 Z" fill="url(#gold)"/>
      <rect x="62" y="154" width="76" height="16" rx="5" fill="url(#gold)"/>
      <rect x="50" y="170" width="100" height="26" rx="6" fill="#1D1E22"/>
      <rect x="70" y="177" width="60" height="12" rx="3" fill="#FFC21A"/>
      <!-- lightning bolt -->
      <g class="bolt-flash">
        <path d="M112 30 L70 84 H98 L84 124 L134 64 H104 L120 30 Z" fill="#C8102E" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </svg>
    <h1>Mr. Mo’s Games</h1>
    <p class="tagline">Pick a flag and start your race!</p>
  </header>

  <main>
    <ul class="grid" id="games"></ul>
  </main>

  <nav class="sibling" aria-label="Other games">
    <a href="https://mellymos.games/"><span aria-hidden="true">🐱</span>Visit Melly Mo’s Games</a>
  </nav>

  <footer>Made with love, one game at a time.</footer>

<script>
  // ---- Add new games here. Each game lives at /games/<slug>/index.html ----
  const GAMES = [
    // { slug: "bubble-pop", title: "Bubble Pop", icon: "🫧" },
    { slug: "math-race", title: "Math Race", icon: "🏎️" },
    { slug: "bilingual-bingo", title: "Bilingual Bingo", icon: "🔤" },
    { slug: "bone-builder", title: "Bone Builder ABC", icon: "🦴" },
    { slug: "ramp-rally", title: "Ramp Rally", icon: "🛻" },
  ];

  const list = document.getElementById("games");
  const tile = (g) => {
    const li = document.createElement("li");
    const el = document.createElement(g ? "a" : "div");
    el.className = "flag" + (g ? "" : " soon");
    if (g) el.href = "/games/" + g.slug + "/";
    el.innerHTML =
      '<div class="cloth"><div class="plate">' +
      '<span class="icon" aria-hidden="true">' + (g ? g.icon : "🏁") + '</span>' +
      '<span class="name">' + (g ? g.title : "Coming soon!") + '</span>' +
      '</div></div>';
    li.appendChild(el);
    return li;
  };
  GAMES.forEach((g) => list.appendChild(tile(g)));
  if (GAMES.length === 0) list.appendChild(tile(null));
</script>
</body>
</html>
