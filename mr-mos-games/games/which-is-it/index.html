<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Is It? Haunted House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#1b0e30; --pumpkin:#ff8a1f; --moon:#fff4c2; --mint:#6ff0c8; --candy:#ff5fa2; --ink:#24123d;
  --tile:#f4eeff; --tile-hover:#ffffff; --text:#f6efff; --muted:#c7b6e6; --good:#3fd47f; --bad:#ff5d73;
  --body:"Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --spooky:"Creepster", "Chiller", "Fredoka", fantasy, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#1b0e30; --text:#f6efff; } }
:root[data-theme="dark"]{ --night:#1b0e30; --text:#f6efff; }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; font-family:var(--body); color:var(--text);
  background:
    radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%),
    radial-gradient(2px 2px at 78% 12%, #fff6 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 30%, #fff5 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 44%, #fff5 50%, transparent 51%),
    radial-gradient(circle at 85% 8%, #4a2a7a 0, transparent 40%),
    linear-gradient(180deg, #120824 0%, var(--night) 55%, #241040 100%);
  background-attachment:fixed; background-color:var(--night);
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mint); outline-offset:3px}

/* ---------- Setup ---------- */
#setup{max-width:620px; margin:0 auto; padding:18px 18px 40px}
.hero{display:flex; align-items:center; gap:12px; justify-content:center; margin:6px 0 4px}
.hero h1{font-family:var(--spooky); font-weight:400; font-size:clamp(46px,13vw,76px); line-height:.95; margin:0; color:var(--pumpkin);
  text-shadow:0 3px 0 #7a2c00, 0 0 24px #ff8a1f66; letter-spacing:1px}
.hero .sub{display:block; font-size:.42em; color:var(--mint); text-shadow:0 2px 0 #0d3b2f, 0 0 16px #6ff0c855}
.floaty{width:70px; height:80px; flex:none; animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
.tag{text-align:center; color:var(--muted); margin:2px 0 18px; font-size:17px}
fieldset{margin:0 0 16px; padding:14px; background:#2a164acc; border-radius:20px; border:2px solid #4b2d7a}
legend{float:left; width:100%; padding:0; margin:0 0 10px; font-weight:600; font-size:18px; color:var(--moon)}
.seg{display:flex; gap:8px; flex-wrap:wrap; clear:both}
.pill{min-height:48px; padding:8px 16px; border-radius:999px; border:2px solid #6a4a9a; background:#1c0f33; font-weight:600; font-size:17px}
.pill[aria-pressed="true"]{background:var(--pumpkin); border-color:#ffd0a0; color:#2a1200; box-shadow:0 3px 0 #9a4300}
.pill:hover{border-color:var(--mint)}
.players{display:grid; gap:14px; margin-top:14px; clear:both}
.pblock{background:#1c0f33; border-radius:16px; padding:10px; border:2px solid var(--pc)}
.prow{display:flex; gap:8px; align-items:center}
.pdot{width:20px; height:20px; border-radius:50%; background:var(--pc); flex:none; box-shadow:0 0 0 3px #1c0f33, 0 0 0 5px var(--pc)}
.prow input{flex:1; min-width:0; min-height:48px; font-size:17px; padding:6px 12px; border-radius:14px; border:2px dashed #7a5aa8; background:#140a26}
.pickL{margin:10px 2px 6px; font-weight:600; color:var(--muted); font-size:15px}
.pieces{display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:8px}
.pc{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px 8px; border-radius:14px; border:2px solid #4b2d7a; background:#24123d; font-size:14px; font-weight:600; min-height:44px}
.pc svg{width:52px; height:60px}
.pc[aria-pressed="true"]{border-color:var(--pc); background:#3a2160; box-shadow:0 0 0 3px var(--pc)}
.pc:hover{border-color:var(--mint)}
.robotrow{display:flex; align-items:center; gap:10px; background:#1c0f33; border-radius:16px; padding:8px 12px; border:2px solid #b8c4d9}
.robotrow svg{width:46px; height:54px}
.vrow{display:flex; gap:8px; flex-wrap:wrap; clear:both}
.vrow select{flex:1; min-width:180px; min-height:48px; font-size:16px; border-radius:14px; border:2px solid #6a4a9a; background:#1c0f33; padding:0 10px}
.btn{min-height:48px; padding:8px 16px; border-radius:14px; border:2px solid #6a4a9a; background:#1c0f33; font-weight:600; font-size:16px}
.btn:hover{border-color:var(--mint)}
.go{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:64px; border-radius:22px; border:0;
  background:var(--pumpkin); color:#2a1200; font-size:24px; font-weight:700; box-shadow:0 5px 0 #9a4300, 0 0 30px #ff8a1f55}
.go:hover{background:#ffa04a}
.go:active{transform:translateY(3px); box-shadow:0 2px 0 #9a4300}
.warn{color:#ffb3c0; min-height:1.3em; text-align:center; margin:8px 0 0}

/* ---------- Game ---------- */
#game{height:100vh; height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr)}
.bar{display:flex; align-items:center; gap:6px; padding:6px 10px; padding-left:max(10px,env(safe-area-inset-left)); padding-right:max(10px,env(safe-area-inset-right))}
.bar .spacer{flex:1}
.bar .ttl{font-family:var(--spooky); color:var(--pumpkin); font-size:26px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ibtn{min-height:44px; min-width:44px; padding:4px 10px; border-radius:12px; border:2px solid #5a3a8a; background:#1c0f33cc; font-weight:600; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:6px}
.ibtn[aria-pressed="true"]{background:var(--mint); color:#062a20; border-color:#c8fff0}
.play{display:grid; grid-template-rows:minmax(0,1fr) auto; gap:8px; padding:0 10px 10px; min-height:0;
  padding-left:max(10px,env(safe-area-inset-left)); padding-right:max(10px,env(safe-area-inset-right))}
.boardwrap{position:relative; min-height:0; display:flex; justify-content:center; align-items:center}
.boardwrap svg{height:100%; width:auto; max-width:100%; aspect-ratio:600/934; display:block; border-radius:18px; filter:drop-shadow(0 8px 20px #0008); background:#120824}
.panel{display:flex; flex-direction:column; gap:8px; min-width:0}
.loadwrap{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; color:var(--muted)}
.loadbar{flex:1; height:10px; border-radius:999px; background:#1c0f33; border:2px solid #5a3a8a; overflow:hidden}
.loadbar i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--pumpkin),var(--mint)); transition:width .2s}
.turn{display:flex; align-items:center; gap:10px; font-weight:600; font-size:19px}
.turn .tk{width:44px; height:48px; border-radius:12px; display:grid; place-items:center; border:3px solid var(--pc); background:#1c0f33; flex:none}
.turn .tk svg{width:36px; height:42px}
.cardmini{margin-left:auto; display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 6px; border-radius:12px; background:#fffaf0; color:var(--ink); font-size:15px; font-weight:700; white-space:nowrap; box-shadow:0 0 0 3px var(--pc,#ffd23f); transform:rotate(-2deg)}
.cardmini:empty{display:none}
.cardmini .sws{display:inline-flex; flex-direction:column; gap:3px}
.cardmini .sws i{display:block; width:30px; height:13px; border-radius:4px; border:2px solid #24123d}
.cardmini .sws.one i{height:22px}
.cardmini.hard{box-shadow:0 0 0 3px var(--candy), 0 0 16px #ff5fa288}
.pvpath{stroke-dasharray:2 12; animation:march .8s linear infinite}
@keyframes march{to{stroke-dashoffset:-14}}
.pvring{transform-box:fill-box; transform-origin:center; animation:pv 1.2s ease-in-out infinite}
@keyframes pv{50%{transform:scale(1.18); opacity:.5}}
.turn .badge{margin-left:auto; padding:4px 12px; border-radius:999px; font-size:15px; background:#ffd23f; color:#3a2400; white-space:nowrap}
.turn .badge.hard{background:var(--candy); color:#3a0020; box-shadow:0 0 14px #ff5fa288}
.qcard{background:#2a164ae6; border:2px solid #5a3a8a; border-radius:22px; padding:12px; display:flex; flex-direction:column; gap:10px}
.qline{display:flex; align-items:center; gap:10px}
.prompt{margin:0; flex:1; font-size:22px; font-weight:600; line-height:1.25}
.chip{display:inline-block; padding:0 10px; border-radius:10px; background:var(--moon); color:var(--ink); font-weight:700; min-width:1.6em; text-align:center}
.chip.hide{background:#4b2d7a; color:var(--moon)}
.hear{width:52px; height:52px; border-radius:50%; border:3px solid var(--mint); background:#123d33; font-size:24px; flex:none}
.hear.on{box-shadow:0 0 0 4px #6ff0c855}
.opts{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px}
.opt{aspect-ratio:1; max-height:130px; border-radius:18px; border:3px solid #cbb8ee; background:var(--tile); color:var(--ink); padding:6%;
  display:grid; place-items:center; container-type:inline-size; box-shadow:0 4px 0 #8c74b8; transition:transform .12s, box-shadow .12s}
.opt:hover:not(:disabled){background:var(--tile-hover); transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(2px); box-shadow:0 2px 0 #8c74b8}
.opt:disabled{cursor:default}
.opt svg{width:100%; height:100%}
.glyph{font-size:62cqw; font-weight:600; line-height:1}
.glyph.two{font-size:46cqw}
.opt.right{border-color:var(--good); box-shadow:0 0 0 4px var(--good), 0 0 22px #3fd47f; background:#e9fff1}
.opt.wrong{border-color:var(--bad); background:#ffe6ea; animation:shake .45s}
.opt.reveal{border-color:var(--good); box-shadow:0 0 0 4px var(--good), 0 0 22px #3fd47f; animation:pulse 1s ease-in-out 2}
.opt.robopick{outline:4px dashed #b8c4d9; outline-offset:3px}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{50%{transform:scale(1.08)}}
.feedback{margin:0; min-height:1.4em; font-size:19px; font-weight:600; text-align:center}
.feedback.good{color:var(--good)} .feedback.bad{color:#ffb3c0}

/* Candy-style color card */
.movecard{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-4deg); background:#fffaf0; color:var(--ink); border-radius:18px;
  padding:14px 18px 12px; border:4px solid #fff; box-shadow:0 0 0 4px var(--pumpkin), 0 12px 30px #000a; text-align:center; pointer-events:none;
  animation:deal .45s cubic-bezier(.2,1.6,.4,1); min-width:150px}
.movecard .sw{display:flex; flex-direction:column; gap:8px; align-items:center}
.movecard .sw i{width:96px; height:46px; border-radius:12px; border:4px solid #24123d; display:block}
.movecard b{display:block; font-size:24px; margin-top:8px}
@keyframes deal{from{transform:translate(-50%,-50%) scale(.2) rotate(-30deg); opacity:0}}

/* pawns */
.pawn{transition:transform .26s ease}
.pawn.glide{transition:transform .9s cubic-bezier(.5,0,.3,1)}
.hop{animation:hop .26s ease}
@keyframes hop{50%{transform:translateY(-20px)}}
.pawn.active .ped{animation:ped 1.2s ease-in-out infinite}
@keyframes ped{50%{stroke-width:6; stroke:#fff}}

/* win overlay */
#win{position:fixed; inset:0; background:#0d0619ee; display:grid; place-items:center; z-index:20; padding:20px}
.wincard{text-align:center; max-width:520px; animation:deal .7s cubic-bezier(.2,1.6,.4,1)}
.wincard svg{width:130px; height:150px}
.wincard h2{font-family:var(--spooky); font-weight:400; color:var(--pumpkin); font-size:clamp(34px,8vw,54px); margin:10px 0 18px; line-height:1.05; text-shadow:0 3px 0 #7a2c00}
.winbtns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.winbtns .go{width:auto; padding:0 24px; font-size:20px; min-height:56px}
.winbtns .btn{min-height:56px}
#fx{position:fixed; inset:0; pointer-events:none; z-index:21}

.zoomwrap{display:none}
@media (orientation:landscape) and (min-width:600px){
  .play{grid-template-rows:minmax(0,1fr); grid-template-columns:auto minmax(0,1fr) minmax(280px,36%); align-items:stretch}
  .boardwrap svg{height:100%; max-width:30vw}
  .zoomwrap{display:block; position:relative; min-width:0; min-height:0; border-radius:18px; overflow:hidden; border:3px solid var(--zc,#6b45a0);
    box-shadow:0 8px 20px #0008, inset 0 0 0 2px #12081f; background:#120824; transition:border-color .3s}
  .zoomwrap svg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .panel{justify-content:center}
  .opts{grid-template-columns:repeat(6,minmax(0,1fr))}
  .opt{grid-column:span 2}
  .opt:nth-child(4){grid-column:2 / span 2}
}
@media (orientation:landscape) and (max-height:520px){
  .bar{padding-top:4px; padding-bottom:4px}
  .bar .ttl{display:none}
  .ibtn{min-height:40px; font-size:14px}
  .prompt{font-size:18px}
  .turn{font-size:16px}
  .turn .tk{width:38px; height:42px} .turn .tk svg{width:30px; height:36px}
  .qcard{padding:8px; gap:8px}
  .hear{width:46px; height:46px; font-size:21px}
  .opt{max-height:86px; border-radius:14px}
  .feedback{font-size:16px}
  .movecard .sw i{width:72px; height:34px}
}
@media (max-width:420px){
  .prompt{font-size:19px}
  .opts{gap:6px}
  .opt{border-radius:14px; border-width:2px}
  .bar{gap:4px; padding-left:max(8px,env(safe-area-inset-left)); padding-right:max(8px,env(safe-area-inset-right))}
  .bar .ttl{font-size:22px}
  .ibtn{padding:4px 6px}
  .ibtn .lbl{display:none}
  #langBtn{font-size:13px; white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>
</head>

function musicPlay(){
  if(!MU.on) return; const a=ac(); if(!a) return;

  if(MU.src) return;
  musicLoad(a).then(b=>{
    if(!b || MU.src || !MU.on) return;
    const s=a.createBufferSource(); s.buffer=b; s.loop=true;

    s.connect(MU.gain); s.start(0, MU.loopStart||0); MU.src=s;
    const t=a.currentTime; MU.gain.gain.cancelScheduledValues(t); MU.gain.gain.setValueAtTime(0,t);

}

}

  if(!MU.src||!AC) return; const t=AC.currentTime;

}

/* ================= RECORDED VOICE (AI Storyteller) =================
   Every spoken line has a clip in audio/<lang>/, mapped by its exact text in audio/manifest.json.
   One shared <audio> element plays them, so it works on iPhone/iPad once a tap has unlocked it.
   Any line without a clip (or one that fails to load or play) is spoken by the device voice instead. */
const AI='ai';
const VO={ base:'audio/', map:null, groups:{}, blobs:{}, el:null, finish:null, log:[] };
const VO_READY = fetch(VO.base+'manifest.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(m=>{
  VO.map={}; ((m&&m.lines)||[]).forEach(l=>{ VO.map[l.lang+'|'+l.text]=l.file; (VO.groups[l.lang+'|'+(l.group||'common')] ||= []).push(l.file); });
}).catch(()=>{ VO.map={}; });
function voEl(){ if(!VO.el){ VO.el=new Audio(); VO.el.preload='auto'; VO.el.setAttribute('playsinline',''); } return VO.el; }
function silentWav(){ // 0.05 s of silence, used to unlock the audio element on the first tap
  const n=400, buf=new ArrayBuffer(44+n*2), v=new DataView(buf), w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  let s=''; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return 'data:audio/wav;base64,'+btoa(s);
}
let voUnlocked=false;
function voUnlock(){
  if(voUnlocked) return; voUnlocked=true; const a=voEl(); if(a.src && !a.paused) return;
  try{ a.src=silentWav(); const p=a.play(); if(p&&p.catch) p.catch(()=>{ voUnlocked=false; }); }catch(e){ voUnlocked=false; }
}
function fetchWithTimeout(url, ms){
  return Promise.race([fetch(url), sleep(ms).then(()=>{ throw new Error('timeout'); })]);
}
function loadClip(file){
  if(!VO.blobs[file]){
    VO.blobs[file] = fetchWithTimeout(VO.base+file, 8000)
      .then(r=>{ if(!r.ok) throw new Error('missing '+file); return r.blob(); })
      .then(b=>URL.createObjectURL(b))
      .catch(()=>{ delete VO.blobs[file]; return null; });   // try again next time
  }
  return VO.blobs[file];
}
async function clipFor(text){
  await VO_READY; const file=VO.map[lang+'|'+text];
  if(!file) return null;
  const url=await loadClip(file); return url ? {file,url} : null;
}
function playClip(url, tok){
  return new Promise(resolve=>{
    const a=voEl(); let done=false, timer;
    const fin=ok=>{ if(done) return; done=true; clearTimeout(timer); a.onended=a.onerror=null; if(VO.finish===fin) VO.finish=null; resolve(ok); };
    VO.finish=fin;
    if(tok!==speakTok) return fin(false);
    a.onended=()=>fin(true); a.onerror=()=>fin(false);
    try{ a.src=url; const p=a.play(); if(p&&p.catch) p.catch(()=>fin(false)); }catch(e){ fin(false); }
    timer=setTimeout(()=>fin(true), 15000);

}
/* Preload this language's clips for the chosen categories, with the loading bar. Resolves when done (or after 15 s). */
let preloadTok=0;
function preloadLang(l){
  const tok=++preloadTok, wrap=$('loadWrap'), fill=$('loadFill');
  if(voiceMode()!==AI) { wrap.hidden=true; return Promise.resolve(); }
  return VO_READY.then(()=>{
    const files=[...new Set(['common'].concat(cats).flatMap(g=>VO.groups[l+'|'+g]||[]))];
    if(!files.length){ wrap.hidden=true; return; }
    let n=0; const step=()=>{ if(tok!==preloadTok) return; n++; const pct=Math.round(n*100/files.length); fill.style.width=pct+'%'; wrap.setAttribute('aria-valuenow',pct); };
    fill.style.width='0%'; wrap.hidden=false;
    const queue=files.slice(); const worker=async()=>{ while(queue.length){ await loadClip(queue.shift()); step(); } };
    const all=Promise.all(Array.from({length:6},worker));
    return Promise.race([all, sleep(15000)]).then(()=>sleep(150)).then(()=>{ if(tok===preloadTok) wrap.hidden=true; });
  });
}

/* ================= SPEECH ================= */
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let voices=[]; let speakTok=0;
function loadVoices(){ try{ voices = synth ? synth.getVoices() : []; }catch(e){ voices=[]; } fillVoiceSel(); }
function langVoices(){ return voices.filter(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith(lang)); }
function voiceMode(){ const v=store.get('voice-'+lang, AI); return v==null ? AI : v; }
function currentVoice(){
  const list=langVoices(); const saved=voiceMode();
  if(saved && saved!==AI){ const v=list.find(v=>v.voiceURI===saved); if(v) return v; }
  const pref = lang==='es' ? ['es-mx','es-us','es-es'] : ['en-us','en-gb'];
  for(const p of pref){ const v=list.find(v=>v.lang.toLowerCase().replace('_','-')===p && v.localService!==false); if(v) return v; }
  return list[0]||null;
}
function setTalking(on){ setHear(on); musicDuck(on); }
function deviceSay(text, tok){
  if(!synth) return sleep(200);
  return new Promise(resolve=>{
    let done=false, timer;
    const fin=()=>{ if(done) return; done=true; clearTimeout(timer); resolve(); };
    try{
      const u=new SpeechSynthesisUtterance(text); const v=currentVoice();
      if(v){ u.voice=v; u.lang=v.lang; } else u.lang = lang==='es'?'es-MX':'en-US';
      u.rate=.85; u.pitch=1.05; u.onend=fin; u.onerror=fin;
      timer=setTimeout(fin, 5000+text.length*70);
      if(tok!==speakTok) return fin();
      setTalking(true); synth.speak(u);
    }catch(e){ fin(); }
  });
}
function speak(parts){
  const tok=++speakTok;
  try{ synth && synth.cancel(); }catch(e){}
  if(VO.finish) VO.finish(false);
  try{ if(VO.el && !VO.el.paused) VO.el.pause(); }catch(e){}
  if(!soundOn || !parts.length){ setTalking(false); return sleep(200); }
  return (async()=>{
    for(const text of parts){
      if(tok!==speakTok) return;
      let ok=false;
      if(voiceMode()===AI){
        const c=await clipFor(text); if(tok!==speakTok) return;
        if(c){ setTalking(true); VO.log.push({lang, text, file:c.file}); ok=await playClip(c.url, tok); }
      }
      if(tok!==speakTok) return;
      if(!ok){ VO.log.push({lang, text, file:null}); await deviceSay(text, tok); }
      if(tok!==speakTok) return;
      await sleep(200);
    }
  })().finally(()=>{ if(tok===speakTok) setTalking(false); });
}
function setHear(on){ const b=$('hearBtn'); if(b) b.classList.toggle('on',on); }
const say = (parts,max) => Promise.race([speak(parts), sleep(max||9000)]);

/* ================= OPTION ART ================= */
function poly(n,r,rot){ const p=[]; for(let i=0;i<n;i++){ const a=rot+i*2*Math.PI/n; p.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1)); } return p.join(' '); }
function starPts(){ const p=[]; for(let i=0;i<10;i++){ const r=i%2?19:44, a=-Math.PI/2+i*Math.PI/5; p.push((50+r*Math.cos(a)).toFixed(1)+','+(54+r*Math.sin(a)).toFixed(1)); } return p.join(' '); }
function shapeSVG(k,c){
  const s=`fill="${c}" stroke="#24123d" stroke-width="4" stroke-linejoin="round"`;
  const m={
    circle:`<circle cx="50" cy="50" r="40" ${s}/>`, square:`<rect x="14" y="14" width="72" height="72" rx="3" ${s}/>`,
    triangle:`<polygon points="50,10 92,86 8,86" ${s}/>`, star:`<polygon points="${starPts()}" ${s}/>`,
    heart:`<path d="M50 88 C18 66 4 46 16 27 C28 10 45 15 50 30 C55 15 72 10 84 27 C96 46 82 66 50 88 Z" ${s}/>`,
    crescent:`<path d="M62 10 A41 41 0 1 0 62 90 A46 46 0 0 1 62 10 Z" ${s}/>`,
    rectangle:`<rect x="5" y="26" width="90" height="48" rx="3" ${s}/>`, oval:`<ellipse cx="50" cy="50" rx="45" ry="27" ${s}/>`,
    diamond:`<polygon points="50,5 86,50 50,95 14,50" ${s}/>`, pentagon:`<polygon points="${poly(5,44,-Math.PI/2)}" ${s} transform="translate(0,3)"/>`,
    hexagon:`<polygon points="${poly(6,44,0)}" ${s}/>`, octagon:`<polygon points="${poly(8,44,Math.PI/8)}" ${s}/>`
  };
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${m[k]}</svg>`;
}
function ghostSVG(hex){
  const eye = hex==='#1a1a1a' ? '#ffffff' : '#24123d';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 92 V46 A32 32 0 0 1 82 46 V92 L71 82 L60 92 L50 82 L40 92 L29 82 Z" fill="${hex}" stroke="#24123d" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="39" cy="50" r="6" fill="${eye}"/><circle cx="61" cy="50" r="6" fill="${eye}"/><ellipse cx="50" cy="66" rx="6" ry="7" fill="${eye}"/></svg>`;
}
function dotsSVG(n,c){
  let pts=[];
  if(n===10){ for(let i=0;i<10;i++) pts.push([14+(i%5)*18, 36+Math.floor(i/5)*28]); }
  else { const rows=Math.ceil(n/3); for(let i=0;i<n;i++){ const r=Math.floor(i/3), inRow=Math.min(3,n-r*3), col=i%3;
    pts.push([50+(col-(inRow-1)/2)*28, 50+(r-(rows-1)/2)*28]); } }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="${c}" stroke="#24123d" stroke-width="3"/>`).join('')}</svg>`;
}

/* ================= QUESTIONS ================= */
function fill(target,pool,pre){ const out=[target]; for(const p of shuffle(pre||[])) if(out.length<5 && !out.includes(p)) out.push(p);
  for(const p of shuffle(pool)) if(out.length<5 && !out.includes(p)) out.push(p); return shuffle(out); }
/* spec is optional: {cat, hard, t, dots} picks one exact question (used to list every spoken line). */
function makeQuestion(spec){
  spec = spec || {};
  const cat = spec.cat || pick(cats);
  const hard = spec.hard!=null ? spec.hard : Math.random() < .35;
  const es = lang==='es';
  let q = {cat, hard};
  if(cat==='shapes'){
    const t = spec.t || (hard ? pick(HARD_SHAPES) : pick(EASY_SHAPES));
    const items = hard ? fill(t, Object.keys(SHAPES), SHAPE_CONFUSE[t]) : fill(t, EASY_SHAPES);
    const cols = shuffle(ART);
    const nm = k => es ? SHAPES[k].es[1] : SHAPES[k].en;
    const art = k => es ? SHAPES[k].es[0]+' '+SHAPES[k].es[1] : 'the '+SHAPES[k].en;
    q.items = items; q.answer = items.indexOf(t);
    q.render = (k,i) => shapeSVG(k, cols[i]); q.label = nm;
    q.prompt = es ? {pre:'¿Cuál es '+SHAPES[t].es[0]+' ', chip:nm(t), post:'?'} : {pre:'Which one is the ', chip:nm(t), post:'?'};
    q.speech = es ? `¿Cuál es ${art(t)}?` : `Which one is ${art(t)}?`;
    q.desc = art(t);
  }
  else if(cat==='letters'){
    const N = es ? LETTER_ES : LETTER_EN; const keys = Object.keys(N); const t = spec.t || pick(keys);
    if(!hard){
      const items = fill(t, keys);
      q.items=items; q.answer=items.indexOf(t);
      q.render = k => `<span class="glyph">${k}</span>`;
      q.label = k => (es?'letra ':'letter ')+N[k];
      q.prompt = es ? {pre:'¿Cuál es la letra ', chip:t, post:'?'} : {pre:'Which one is the letter ', chip:t, post:'?'};
      q.speech = es ? `¿Cuál es la letra ${N[t]}?` : `Which one is the letter ${N[t]}?`;
      q.desc = es ? `la letra ${N[t]}` : `the letter ${N[t]}`;
    } else {
      const lt = t.toLowerCase(); const lowers = keys.map(k=>k.toLowerCase());
      const conf = CONFUSE.filter(g=>g.includes(lt)).flat().filter(x=>lowers.includes(x));
      const items = fill(lt, lowers, conf);
      q.items=items; q.answer=items.indexOf(lt);
      q.render = k => `<span class="glyph">${k}</span>`;
      q.label = k => es ? N[k.toUpperCase()]+' minúscula' : 'little '+N[k.toUpperCase()];
      q.prompt = es ? {pre:'¿Cuál es la ', chip:lt, post:' minúscula?'} : {pre:'Which one is little ', chip:lt, post:'?'};
      q.speech = es ? `¿Cuál es la ${N[t]} minúscula?` : `Which one is little ${N[t]}?`;
      q.desc = es ? `la ${N[t]} minúscula` : `little ${N[t]}`;
    }
  }
  else if(cat==='sounds'){
    const list = SOUNDS[lang]; const pool = hard ? list.filter(s=>s.h) : list;
    const t = spec.t ? list.find(s=>s.L===spec.t) : pick(pool);
    const items = fill(t.L, list.map(s=>s.L)); const N = es ? LETTER_ES : LETTER_EN;
    q.items=items; q.answer=items.indexOf(t.L);
    q.render = k => `<span class="glyph">${hard ? k.toLowerCase() : k}</span>`;
    q.label = k => (es?'letra ':'letter ')+N[k];
    if(es){
      q.prompt = {pre:'¿Qué letra hace el sonido ', chip:t.say, post: hard ? '?' : `, como ${t.e} ${t.w}?`};
      q.speech = hard ? `¿Qué letra hace el sonido... ${t.say}... ?` : `¿Qué letra hace el sonido... ${t.say}... como ${t.w}?`;
      q.desc = `la letra ${N[t.L]}, ${t.say}`;
    } else {
      q.prompt = {pre:'Which letter makes the ', chip:t.say, post: hard ? ' sound?' : ` sound, like ${t.e} ${t.w}?`};
      q.speech = hard ? `Which letter makes the sound... ${t.say}?` : `Which letter makes the sound... ${t.say}... like ${t.w}?`;
      q.desc = `the letter ${N[t.L]}, ${t.say}`;
    }
  }
  else if(cat==='numbers'){
    const W = es ? NUM_ES : NUM_EN; const cols = shuffle(ART);
    const dots = spec.dots!=null ? spec.dots : (hard && Math.random()<.5);
    if(dots){
      const t = spec.t || 3+rand(7); const pool=[]; for(let n=1;n<=10;n++) pool.push(n);
      const items = fill(t, pool, [t-1,t+1].filter(n=>n>=1&&n<=10));
      q.items=items; q.answer=items.indexOf(t);
      q.render = (k,i) => dotsSVG(k, cols[i]);
      q.label = k => es ? `${W[k]} ${k===1?'punto':'puntos'}` : `${W[k]} ${k===1?'dot':'dots'}`;
      q.prompt = es ? {pre:'¿Cuál tiene ', chip:String(t), post:' puntos?'} : {pre:'Which one has ', chip:String(t), post:' dots?'};
      q.speech = es ? `¿Cuál tiene ${W[t]} puntos?` : `Which one has ${W[t]} dots?`;
      q.desc = es ? `el que tiene ${W[t]} puntos` : `the one with ${W[t]} dots`;
    } else {
      const lo = hard?11:1, hi = hard?20:10; const t = spec.t || lo+rand(hi-lo+1);
      const pool=[]; for(let n=lo;n<=hi;n++) pool.push(n); const items = fill(t, pool);
      q.items=items; q.answer=items.indexOf(t);
      q.render = k => `<span class="glyph${k>9?' two':''}">${k}</span>`;
      q.label = k => (es?'número ':'number ')+W[k];
      q.prompt = es ? {pre:'¿Cuál es el número ', chip:String(t), post:'?'} : {pre:'Which one is the number ', chip:String(t), post:'?'};
      q.speech = es ? `¿Cuál es el número ${W[t]}?` : `Which one is the number ${W[t]}?`;
      q.desc = es ? `el número ${W[t]}` : `the number ${W[t]}`;
    }
  }
  else {
    const t = spec.t || (hard ? pick(HARD_COLORS) : pick(EASY_COLORS));
    const items = hard ? fill(t, Object.keys(COLORS), COLOR_CONFUSE[t]) : fill(t, EASY_COLORS);
    const nm = k => COLORS[k][lang];
    q.items=items; q.answer=items.indexOf(t);
    q.render = k => ghostSVG(COLORS[k].hex);
    q.label = k => es ? 'fantasma '+nm(k) : nm(k)+' ghost';
    q.prompt = es ? {pre:'¿Cuál es el fantasma ', chip:nm(t), post:'?'} : {pre:'Which ghost is ', chip:nm(t), post:'?'};
    q.speech = es ? `¿Cuál es el fantasma ${nm(t)}?` : `Which ghost is ${nm(t)}?`;
    q.desc = es ? `el fantasma ${nm(t)}` : `the ${nm(t)} ghost`;
  }
  q.key = cat+':'+q.items[q.answer]+':'+hard;
  return q;
}

/* Every line the game can speak in one language, found by walking every question the game can ask
   (not by sampling). Each entry: {text, group, cat, hard, kind, t}. Used to build audio/manifest.json and by the tests. */
function allLines(l){
  const keep=lang; lang=l; const t=T[l], out=[], seen=new Set();
  const add=(text,group,extra)=>{ if(seen.has(text)) return; seen.add(text); out.push(Object.assign({text,group},extra||{})); };
  const specs=[];
  EASY_SHAPES.forEach(s=>specs.push({cat:'shapes',hard:false,t:s})); HARD_SHAPES.forEach(s=>specs.push({cat:'shapes',hard:true,t:s}));
  Object.keys(l==='es'?LETTER_ES:LETTER_EN).forEach(k=>{ specs.push({cat:'letters',hard:false,t:k}); specs.push({cat:'letters',hard:true,t:k}); });
  SOUNDS[l].forEach(s=>{ specs.push({cat:'sounds',hard:false,t:s.L}); if(s.h) specs.push({cat:'sounds',hard:true,t:s.L}); });
  for(let n=1;n<=10;n++) specs.push({cat:'numbers',hard:false,dots:false,t:n});
  for(let n=11;n<=20;n++) specs.push({cat:'numbers',hard:true,dots:false,t:n});
  for(let n=3;n<=9;n++) specs.push({cat:'numbers',hard:true,dots:true,t:n});
  EASY_COLORS.forEach(c=>specs.push({cat:'colors',hard:false,t:c})); HARD_COLORS.forEach(c=>specs.push({cat:'colors',hard:true,t:c}));
  for(const s of specs){
    const q=makeQuestion(s), info={cat:s.cat, hard:s.hard, t:String(s.t), dots:!!s.dots};
    add(q.speech, s.cat, Object.assign({kind:'question'},info));
    add(t.its(q.desc), s.cat, Object.assign({kind:'reveal'},info));
  }
  ORDER.forEach(c=>[false,true].forEach(d=>add(t.yes+' '+t.card(t.candy[c],d),'common',{kind:'card',color:c,dbl:d})));
  add(t.boo,'common',{kind:'boo'}); add(t.passage,'common',{kind:'passage'}); add(t.testSay,'common',{kind:'test'});
  PIECES.concat('robot').forEach(k=>{ add(t.turnSay(k),'common',{kind:'turn',piece:k}); add(t.winSay(k),'common',{kind:'win',piece:k}); });
  lang=keep; return out;
}

/* ================= BOARD ================= */
const BW=600, ROOF=150, FH=180, YARD=64, BH=ROOF+FH*4+YARD, PER=8, LAST=63;
const ORDER=['red','purple','yellow','blue','orange','green'];
const CC={red:'#ff4d6a', purple:'#a764ff', yellow:'#ffd23f', blue:'#3fa3ff', orange:'#ff8f2e', green:'#3fd47f'};
const PASS={4:19, 37:50};
const ROOMS=[
 [{wall:'#3b2352', pat:'damask', ink:'#ecdcff'}, {wall:'#4a2236', pat:'check',  ink:'#ffc996'}],
 [{wall:'#21305f', pat:'stars',  ink:'#c2dbff'}, {wall:'#1b3d2f', pat:'vine',   ink:'#a8f7bd'}],
 [{wall:'#2f2f4a', pat:'stripe', ink:'#e6e6f4'}, {wall:'#4a381c', pat:'glyph',  ink:'#ffe3a3'}],
 [{wall:'#2a1745', pat:'brick',  ink:'#ebcbff'}, {wall:'#3b2134', pat:'plank',  ink:'#ffc9e9'}]];
function posOf(i){
  const r=Math.floor(i/PER), k=i%PER, c = r%2===0 ? k : PER-1-k, f=Math.floor(r/2);
  const top=ROOF+(3-f)*FH; return {x:50+c*(500/7), y: top + (r%2===0 ? 132 : 52)};
}

function roomArt(f,s,x0,top){
  const FL=top+FH-6, cx=x0+147, R=x0+294;
  const C=CC; let a='';
  if(f===0&&s===0){ a+=at(x0,top,1,P.web(1)); a+=at(cx,top+34,.42,P.portrait(P.ghostInPortrait)); a+=at(x0+226,FL,.95,P.clock()); a+=at(x0+200,top+30,.7,P.candelabra()); }
  if(f===0&&s===1){ a+=at(cx,top+34,1,P.shelf(P.jar(-38,C.red)+P.jar(-12,C.blue)+P.jar(14,C.green)+P.jar(40,C.purple))); a+=at(x0+250,FL,1,P.pumpkin(1.15)+at(26,0,1,P.pumpkin(.8))); a+=at(x0+44,FL,1,P.pumpkin(.75)); }
  if(f===1&&s===0){ a+=at(cx,top,1,P.chandelier()); a+=at(x0+40,top+32,.8,P.floatGhost()); a+=at(x0+252,top+30,.7,P.floatGhost()); a+=at(x0+226,FL,.68,P.armchair()); a+=at(x0+46,FL-8,.9,P.floatGhost()); }
  if(f===1&&s===1){ a+=at(cx,top+34,1,P.shelf(P.bottle(-40,C.purple,0)+P.bottle(-16,C.green,1)+P.bottle(8,'#ff5fa2',2)+P.bottle(34,C.blue,0))); a+=at(x0+140,FL,.9,P.cauldron()); a+=at(x0+268,FL,.95,P.broom()); }
  if(f===2&&s===0){ a+=at(x0+48,FL,1,P.wardrobe()); a+=at(cx,top+34,.42,P.portrait(P.skullInPortrait)); a+=at(x0+250,FL,1,P.bones()); a+=at(R,top,1,P.web(-1)); }
  if(f===2&&s===1){ a+=at(x0+48,FL,1,P.bookshelf()); a+=at(x0+252,FL,1,P.sarcophagus()); a+=at(cx,top+30,.7,P.candelabra()); }
  if(f===3&&s===0){ a+=at(x0+150,top+6,1,P.bunting(140)); a+=at(x0+226,top+70,.62,P.bell()); a+=at(x0+110,top+164,1.1,P.batSil()); a+=at(x0+180,top+152,.8,P.batSil()); }
  if(f===3&&s===1){ a+=at(R,top,1,P.web(-1)); a+=at(x0+96,top,1,P.spider(20)); a+=at(cx+30,top+18,1,P.roundWindow(12)); a+=at(x0+250,FL,1,P.trunk()); a+=at(x0+44,FL,1,P.bones()); }
  return a;
}

function candy(i){
  const p=posOf(i), c=CC[colorKey(i)], x=p.x, y=p.y, st='stroke="#12081f" stroke-width="3" stroke-linejoin="round"';
  const kind=i%3; let s=`<ellipse cx="${x}" cy="${y+16}" rx="18" ry="5" fill="#000" opacity=".35"/>`;
  if(kind===0){
    s += `<path d="M${x-15} ${y} L${x-30} ${y-11} L${x-27} ${y} L${x-30} ${y+11} Z M${x+15} ${y} L${x+30} ${y-11} L${x+27} ${y} L${x+30} ${y+11} Z" fill="${c}" ${st}/>`;
    s += `<circle cx="${x}" cy="${y}" r="18" fill="${c}" ${st}/>`;
    s += `<path d="M${x-8} ${y-15} L${x-14} ${y+11} M${x+3} ${y-17} L${x-3} ${y+17} M${x+13} ${y-11} L${x+8} ${y+15}" stroke="#ffffff88" stroke-width="3.5" stroke-linecap="round"/>`;
  } else if(kind===1){
    s += `<path d="M${x-20} ${y+15} Q${x-22} ${y-19} ${x} ${y-20} Q${x+22} ${y-19} ${x+20} ${y+15} Z" fill="${c}" ${st}/>`;
    [[-8,-6],[5,-11],[9,2],[-4,6],[-12,8],[13,10]].forEach(d=> s+=`<circle cx="${x+d[0]}" cy="${y+d[1]}" r="1.8" fill="#ffffffcc"/>`);
  } else {
    s += `<circle cx="${x}" cy="${y}" r="20" fill="#fff" ${st}/>`;
    for(let a=0;a<6;a+=2){ const a0=a*Math.PI/3, a1=(a+1)*Math.PI/3;
      s += `<path d="M${x} ${y} L${(x+19*Math.cos(a0)).toFixed(1)} ${(y+19*Math.sin(a0)).toFixed(1)} A19 19 0 0 1 ${(x+19*Math.cos(a1)).toFixed(1)} ${(y+19*Math.sin(a1)).toFixed(1)} Z" fill="${c}"/>`; }
    s += `<circle cx="${x}" cy="${y}" r="5" fill="${c}" stroke="#fff" stroke-width="2"/>`;
  }
  s += `<ellipse cx="${x-7}" cy="${y-9}" rx="6" ry="3.5" fill="#fff" opacity=".45"/>`;
  return s;
}

function drawBoard(){
  const t=T[lang]; const svg=$('board');
  const F='font-family="Fredoka, system-ui, sans-serif"';
  const HB=ROOF+FH*4;
  let h = '';

/* where a right answer would take you this turn */
function showPreview(){
  const layers=document.querySelectorAll('.pvl'); if(!layers.length) return;
  if(!G || !G.card || G.answered){ layers.forEach(g=>g.innerHTML=''); return; }
  const p=G.players[G.turn], from=p.pos, to=G.card.dest, tp=posOf(to);
  let d=''; for(let i=from;i<=to;i++){ const q=posOf(i); d+=(i===from?'M':'L')+q.x.toFixed(1)+' '+q.y+' '; }
  const html = `<path class="pvpath" d="${d}" fill="none" stroke="${p.color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pvring" cx="${tp.x.toFixed(1)}" cy="${tp.y}" r="30" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="${tp.x.toFixed(1)}" cy="${tp.y}" r="30" fill="none" stroke="${p.color}" stroke-width="4" stroke-dasharray="7 6"/>
    <g transform="translate(${tp.x.toFixed(1)} ${tp.y+8})" opacity=".55"><use href="#pc-${p.piece}" transform="scale(.82)"/></g>`;
  layers.forEach(g=>g.innerHTML=html);
}
function drawPawns(){
  const layers=document.querySelectorAll('.pwl'); if(!layers.length) return;
  const html = G.players.map((p,i)=>`<g class="pawn p${i}" style="transition:none"><g class="hopper">
     <ellipse class="ped" cx="0" cy="2" rx="17" ry="6" fill="${p.color}" stroke="#12081f" stroke-width="3"/>
     <use href="#pc-${p.piece}" transform="scale(.82)"/></g></g>`).join('');
  layers.forEach(g=>g.innerHTML=html);
  placePawns();
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.pawn').forEach(el=>el.style.transition='')));
}
const pawnEls = i => document.querySelectorAll('.pawn.p'+i);
function pawnXY(i){
  const p=G.players[i], base=posOf(p.pos);
  const same = G.players.filter(q=>q.pos===p.pos);
  const k=same.indexOf(p), n=same.length, off = n<2 ? 0 : (k-(n-1)/2)*26;
  return {x:base.x+off, y:base.y+8};
}
function placePawns(){
  G.players.forEach((p,i)=>{ const xy=pawnXY(i);
    pawnEls(i).forEach(el=>{ el.style.transform=`translate(${xy.x.toFixed(1)}px,${xy.y}px)`; el.classList.toggle('active', i===G.turn && G.players.length>1); }); });
  pawnEls(G.turn).forEach(el=>el.parentNode && el.parentNode.appendChild(el));
}

/* ---------- cameras: the main board (zooms in/out on phones) and the close-up (landscape) ---------- */
const CAMS={ board:{vb:[0,0,BW,BH], tok:0}, zoom:{vb:[0,0,300,300], tok:0} };
const dualMQ = matchMedia('(orientation:landscape) and (min-width:600px)');
const dual = () => dualMQ.matches;
function setVB(v, name){ name=name||'board'; CAMS[name].vb=v; $(name).setAttribute('viewBox', v.map(n=>n.toFixed(1)).join(' ')); }
function camTo(target, ms, name){
  name=name||'board'; const cam=CAMS[name]; const tok=++cam.tok;
  if(reduced || !ms){ setVB(target,name); return Promise.resolve(); }
  const from=cam.vb.slice(), t0=performance.now();
  return new Promise(res=>{
    const step=now=>{
      if(tok!==cam.tok) return res();
      const k=Math.min(1,(now-t0)/ms), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      setVB(from.map((v,j)=>v+(target[j]-v)*e), name);
      if(k<1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}
function zoomBox(i){
  const p=posOf(i), w=290, h=w*BH/BW;
  const x=Math.max(0,Math.min(BW-w,p.x-w/2)), y=Math.max(0,Math.min(BH-h,p.y-h*.55));
  return [x,y,w,h];
}
/* close-up box: follows one space, or frames a stretch of spaces (from -> to) */
function closeBox(i, j){
  const el=$('zoomWrap'), ar = el && el.clientWidth ? el.clientHeight/el.clientWidth : 1;
  const a=posOf(i), b=posOf(j==null?i:j);
  let w=Math.max(250, Math.abs(a.x-b.x)+150), h=w*ar;
  const needH=Math.abs(a.y-b.y)+170; if(h<needH){ h=needH; w=h/ar; }
  if(w>380){ w=380; h=w*ar; } if(h>420){ h=420; w=h/ar; }
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const cx=cl((a.x+b.x)/2, a.x-w/2+50, a.x+w/2-50), cy=cl((a.y+b.y)/2-10, a.y-h/2+60, a.y+h/2-50);
  return [Math.max(0,Math.min(BW-w,cx-w/2)), Math.max(0,Math.min(BH-h,cy-h/2)), w, h];
}
function frameTurn(ms){
  if(!G || !dual()) return;
  const p=G.players[G.turn]; $('zoomWrap').style.setProperty('--zc', p.color);
  camTo(closeBox(p.pos, G.card && !G.answered ? G.card.dest : p.pos), ms==null?600:ms, 'zoom');
}
function onLayout(){

}

function playerName(i){ const t=T[lang]; const p=G.players[i]; if(p.robot) return t.robot; return names[p.slot] || (p.slot===0?t.p1:t.p2); }
function startGame(){
  gameId++; CAMS.board.tok++; CAMS.zoom.tok++;
  const ps=[{slot:0, piece:pcs[0], color:PCOL[0], pos:0}];
  if(mode==='two') ps.push({slot:1, piece:pcs[1], color:PCOL[1], pos:0});
  if(mode==='robot') ps.push({slot:2, piece:'robot', color:PCOL[2], pos:0, robot:true});
  G={players:ps, turn:0, q:null, busy:false, lastKey:''};
  $('setup').hidden=true; $('game').hidden=false; $('win').hidden=true;
  $('listenBtn').setAttribute('aria-pressed', String(listenOnly));
  drawBoard(); setVB(FULL.slice()); requestAnimationFrame(()=>frameTurn(0));
  const id=gameId; preloadLang(lang).then(()=>{ if(id===gameId) newTurn(); });
}
function goMenu(){
  gameId++; preloadTok++; $('loadWrap').hidden=true; CAMS.board.tok++; CAMS.zoom.tok++; speak([]); stopFx(); G=null;
  $('game').hidden=true; $('win').hidden=true; $('setup').hidden=false; syncSetup(); applyText(); window.scrollTo(0,0);
}
async function newTurn(){
  const id=gameId; G.busy=false;
  let q, tries=0; do{ q=makeQuestion(); }while(q.key===G.lastKey && ++tries<8);
  G.q=q; G.lastKey=q.key; G.answered=false;
  const color=pick(ORDER), from=G.players[G.turn].pos;
  G.card={color, dbl:q.hard, dest:destination(from,color,q.hard)};
  renderTurn(); placePawns(); showPreview(); frameTurn();
  const p=G.players[G.turn], parts=[];
  if(G.players.length>1) parts.push(T[lang].turnSay(p.piece));
  parts.push(q.speech);
  if(p.robot){
    lockOpts(true); setFeedback(T[lang].thinking,'');
    await Promise.all([say(parts,9000), sleep(1600)]);
    if(id!==gameId || G.answered) return;
    const acc = q.hard ? .65 : .8;
    const choice = Math.random()<acc ? q.answer : pick(q.items.map((_,i)=>i).filter(i=>i!==q.answer));
    const btn=$('opts').children[choice]; if(btn) btn.classList.add('robopick');
    await sleep(700); if(id!==gameId) return;
    answer(choice);
  } else say(parts, 9000);
}
function renderTurn(){
  const t=T[lang], q=G.q, p=G.players[G.turn];
  $('turnTk').innerHTML=pieceSVG(p.piece); $('turnTk').style.setProperty('--pc',p.color);
  $('turnName').textContent = G.players.length>1 ? t.turn(playerName(G.turn)) : playerName(G.turn);
  const c=G.card, nm=t.cname(t.candy[c.color], c.dbl), b=$('cardMini');
  b.innerHTML=`<span class="sws ${c.dbl?'':'one'}">${(c.dbl?[1,2]:[1]).map(()=>`<i style="background:${CC[c.color]}"></i>`).join('')}</span><span>${c.dbl?'👻 ':''}${esc(nm)}</span>`;
  b.classList.toggle('hard', c.dbl); b.style.setProperty('--pc', CC[c.color]); b.setAttribute('aria-label', t.cardAria(nm));
  renderPrompt(false);
  $('opts').innerHTML = q.items.map((k,i)=>`<button class="opt" data-i="${i}" aria-label="${q.label(k)}">${q.render(k,i)}</button>`).join('');
  setFeedback('','');
}
function renderPrompt(reveal){
  const q=G.q, hide = listenOnly && !reveal;
  const chip = hide ? `<span class="chip hide" aria-label="${T[lang].hiddenChip}">🔊?</span>` : `<span class="chip">${esc(q.prompt.chip)}</span>`;
  $('prompt').innerHTML = esc(q.prompt.pre)+chip+esc(q.prompt.post);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setFeedback(txt,cls){ const f=$('feedback'); f.textContent=txt; f.className='feedback'+(cls?' '+cls:''); }
function lockOpts(on){ [...$('opts').children].forEach(b=>b.disabled=on); }

$('opts').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b || !G || G.busy || G.players[G.turn].robot) return;
  ac(); answer(+b.dataset.i);
});
$('hearBtn').addEventListener('click',()=>{ if(!G||!G.q) return; ac(); say([G.q.speech]); });

/* Candy Land rule: go to the next space of the card's color (double = the second one). */
function destination(from, color, dbl){
  let need = dbl ? 2 : 1;
  for(let i=from+1;i<LAST;i++){ if(colorKey(i)===color && --need===0) return i; }
  return LAST;
}
async function answer(i){
  if(G.busy || G.answered) return;
  const id=gameId; G.busy=true; G.answered=true; lockOpts(true);
  const q=G.q, t=T[lang], btns=$('opts').children;
  renderPrompt(true);
  if(i===q.answer){
    btns[i].classList.add('right'); sfx.right();
    const c=G.card, cardTxt=t.card(t.candy[c.color], c.dbl);
    setFeedback(t.yes+' '+cardTxt,'good'); showPreview();
    await say([t.yes+' '+cardTxt], 3500); if(id!==gameId) return;
    await movePawn(G.turn, c.dest, id); if(id!==gameId) return;
    if(G.players[G.turn].pos>=LAST) return win(G.turn);
  } else {
    btns[i].classList.add('wrong'); sfx.boo(); showPreview();
    await sleep(350); if(id!==gameId) return;
    btns[q.answer].classList.add('reveal');
    setFeedback(t.boo+' '+t.its(q.desc),'bad');
    await Promise.all([say([t.boo, t.its(q.desc)], 7000), sleep(1800)]);
    if(id!==gameId) return;
  }
  await sleep(400); if(id!==gameId) return;
  G.turn = (G.turn+1) % G.players.length;
  newTurn();
}
async function movePawn(pi, dest, id){
  const p=G.players[pi], els=[...pawnEls(pi)];
  const two=dual(), cam = two ? 'zoom' : 'board';
  const box = i => two ? closeBox(i) : zoomBox(i);
  await camTo(box(p.pos), two?400:650, cam); if(id!==gameId) return;
  let n=0;
  while(p.pos<dest){
    p.pos++; n++; placePawns(); sfx.step(n);
    els.forEach(el=>{ const h=el.querySelector('.hopper'); if(h){ h.classList.remove('hop'); void h.getBoundingClientRect(); h.classList.add('hop'); } });
    camTo(box(p.pos), 260, cam);
    await sleep(reduced?120:300); if(id!==gameId) return;
  }
  await sleep(250);
  if(PASS[p.pos]!==undefined){
    setFeedback(T[lang].passage,'good'); sfx.whoosh(); say([T[lang].passage], 4000);
    await sleep(500); if(id!==gameId) return;
    p.pos = PASS[p.pos]; els.forEach(el=>el.classList.add('glide')); placePawns();
    await camTo(box(p.pos), 900, cam); if(id!==gameId) return;
    els.forEach(el=>el.classList.remove('glide'));
    await sleep(300);
  }
  await sleep(450); if(id!==gameId) return;
  if(!two) await camTo(FULL.slice(), 750);
}

/* ================= WIN ================= */
async function win(pi){
  const t=T[lang], nm=playerName(pi);
  $('winPc').innerHTML=`<use href="#pc-${G.players[pi].piece}"/>`;
  $('winTitle').textContent=t.win(nm);
  $('win').hidden=false; $('againBtn').focus();
  sfx.win(); startFx();
  await sleep(900); say([t.winSay(G.players[pi].piece)], 8000);
}
$('againBtn').addEventListener('click',()=>{ stopFx(); startGame(); });
$('changeBtn').addEventListener('click',goMenu);
$('menuBtn').addEventListener('click',goMenu);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('win').hidden){ stopFx(); startGame(); } });

$('langBtn').addEventListener('click',()=>{
  lang = lang==='en'?'es':'en'; store.set('lang',lang); applyText();
  if(G){ const kb=CAMS.board.vb.slice(), kz=CAMS.zoom.vb.slice(); drawBoard(); setVB(kb,'board'); setVB(kz,'zoom');
    if(!G.busy){ gameId++; const id=gameId; speak([]); lockOpts(true); preloadLang(lang).then(()=>{ if(id===gameId) newTurn(); }); }
    else preloadLang(lang); }
});
$('listenBtn').addEventListener('click',()=>{ listenOnly=!listenOnly; store.set('listen',listenOnly);
  $('listenBtn').setAttribute('aria-pressed',String(listenOnly)); if(G&&G.q) renderPrompt(G.answered); });
$('soundBtn').addEventListener('click',()=>{ soundOn=!soundOn; $('soundBtn').setAttribute('aria-pressed',String(soundOn));
  $('soundBtn').textContent = soundOn?'🔊':'🔇'; $('soundBtn').setAttribute('aria-label', soundOn?T[lang].soundOn:T[lang].soundOff); if(!soundOn) speak([]); });
$('musicBtn').addEventListener('click',()=>{ MU.on=!MU.on; store.set('music',MU.on); MU.started=true;
  if(MU.on) musicPlay(); else musicStop(); renderMusicBtn(); });

/* ================= CONFETTI ================= */
let fxRaf=0;
function stopFx(){ cancelAnimationFrame(fxRaf); const c=$('fx'); c.getContext('2d').clearRect(0,0,c.width,c.height); }
function startFx(){
  if(reduced) return;
  const c=$('fx'), x=c.getContext('2d'); const dpr=Math.min(2,devicePixelRatio||1);
  c.width=innerWidth*dpr; c.height=innerHeight*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const em=['🍬','🎃','👻','🦇','⭐','🍭','🕸️'];
  const P=[]; const burst=(cx,cy,n)=>{ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=3+Math.random()*7;
    P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,e:pick(em),r:Math.random()*6,vr:(Math.random()-.5)*.2,life:1,sz:22+rand(16)}); } };
  burst(innerWidth/2, innerHeight/2, 50);
  let tms=0; const t0=performance.now();
  const frame=now=>{
    if(now-t0<2200 && now-tms>350){ tms=now; burst(Math.random()*innerWidth, Math.random()*innerHeight*.6, 14); }
    x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){ p.vy+=.18; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=.008;
      if(p.life<=0) continue; x.save(); x.globalAlpha=Math.max(0,p.life); x.translate(p.x,p.y); x.rotate(p.r); x.font=p.sz+'px serif'; x.textAlign='center'; x.fillText(p.e,0,0); x.restore(); }
    if(P.some(p=>p.life>0 && p.y<innerHeight+40)) fxRaf=requestAnimationFrame(frame); else x.clearRect(0,0,innerWidth,innerHeight);
  };
  fxRaf=requestAnimationFrame(frame);
}

/* ================= INIT ================= */
if(synth){ loadVoices(); try{ synth.addEventListener('voiceschanged', loadVoices); }catch(e){ synth.onvoiceschanged=loadVoices; } }
applyText(); syncSetup();
window.__wii = { get G(){return G;}, makeQuestion, setLang:l=>{lang=l;}, destination, colorKey, allLines, voiceLog:VO.log, music:MU, answer:i=>answer(i) };
})();
</script>
